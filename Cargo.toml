[workspace]
resolver="2"
members=[
    "module-01-basic",
    "module-02-routing", 
    "module-03-extractor", 
    "module-04-response", 
    "module-05-state", 
    "module-06-middleware", 
    "module-07-error", 
    "module-08-database", 
    "module-09-auth", 
    "module-10-advanced", 
    "module-11-testing", 
    "module-12-prod"
]
[package]
name = "learn-api"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum-extra = { version = "0.12.6", features = ["typed-header", "query", "multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
jsonwebtoken = "11.0.0"
serde_html_form = "0.4.1"
serde_json = "1.0.151"
tower = { version = "0.5.3", features = ["full"] }
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }


[workspace.dependencies]
axum = { version = "0.8.9", features = ["json", "macros", "query"] }
json = "0.12.4"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.0", features = ["serde", "v7"] }
tower = { version = "0.5.3", features = ["full"] }

